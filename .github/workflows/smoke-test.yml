name: smoke-test

on:
  # Kiểm tra production sau mỗi lần push và chạy định kỳ hằng ngày.
  # Lưu ý: services không ngủ (Serverless/App-Sleeping tắt) nên không cần keep-alive.
  # Workflow này chỉ đóng vai trò "uptime check" + kiểm tra nhanh sau mỗi deploy.
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping client
        run: |
          curl -sS -o /dev/null -w "client %{http_code} in %{time_total}s\n" \
            https://foodhub-client-production.up.railway.app/
      - name: Ping backend (qua proxy client)
        run: |
          curl -sS -o /dev/null -w "backend %{http_code} in %{time_total}s\n" \
            https://foodhub-client-production.up.railway.app/api/v1/health
